<style>
  :root {
    color-scheme: dark;
    --bg: #050505;
    --surface: #121212;
    --line: #2a2a2a;
    --text: #ffffff;
    --muted: #9a9a9a;
    --accent: #ffffff;
    --accent-ink: #000000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
  body {
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 0 max(20px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: calc(100% - 40px);
    max-width: 340px;
    margin: 20px auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px 20px 16px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0,0,0,.25);
    animation: rise .6s cubic-bezier(.2,.7,.2,1) both;
  }
  .avatar {
    width: 80px; height: 80px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 26px; letter-spacing: .02em;
    color: var(--accent); background: var(--bg);
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 6px var(--surface), 0 0 0 7px var(--line);
    overflow: hidden;
    margin: 4px auto 24px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 800; letter-spacing: -.02em; }
  .role { margin: 8px 0 0; font-size: 14px; font-weight: 600; line-height: 1.4; text-wrap: balance; }
  .degrees { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-weight: 500; line-height: 1.4; text-wrap: balance; }
  .uni { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

  .actions { display: grid; grid-template-columns: 1fr 52px; gap: 8px; margin: 24px 0 12px; }
  .save, .share {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 16px; cursor: pointer;
    font: 700 15px "Manrope", sans-serif;
    transition: transform .15s ease, filter .15s ease, border-color .15s ease;
  }
  .save { padding: 14px 20px; border: 0; background: var(--accent); color: var(--accent-ink); }
  .save:hover { filter: brightness(.92); }
  .share { border: 1px solid var(--line); background: transparent; color: var(--text); }
  .share:hover { border-color: var(--text); }
  .save:active, .share:active { transform: scale(.97); }
  .save svg, .share svg { width: 18px; height: 18px; }

  .links { list-style: none; margin: 8px 0 0; padding: 0; text-align: left; }
  .links li + li { border-top: 1px solid var(--line); }
  .links a {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 4px; width: 100%;
    color: var(--text); text-decoration: none;
  }
  .ico {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .ico svg { width: 18px; height: 18px; }
  .links a:hover .ico { background: var(--text); color: var(--accent-ink); border-color: var(--text); }
  .meta { display: flex; flex-direction: column; min-width: 0; }
  .meta small { color: var(--muted); font-size: 12px; font-weight: 500; }
  .meta span { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 12px; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } .save, .share, .ico { transition: none; } }
</style>
</head>

    </button>
  </div>

  <ul class="links" id="links"></ul>
</main>
