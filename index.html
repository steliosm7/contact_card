<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Στυλιανός Μηλιαράκης - Επαφή</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            margin: 10px 0 5px 0;
            font-size: 24px;
            color: #f0f6fc;
        }
        p {
            margin: 0 0 20px 0;
            color: #8b949e;
            font-size: 15px;
            line-height: 1.4;
        }
        .education {
            background-color: #21262d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #30363d;
        }
        .education h3 {
            margin: 0 0 12px 0;
            font-size: 13px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .education ul {
            list-style: none;
            padding: 0;
            margin: 0;
            color: #c9d1d9;
            font-size: 14px;
        }
        .education li {
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .education li:last-child {
            margin-bottom: 0;
        }
        .univ {
            display: block;
            color: #8b949e;
            font-size: 12px;
            margin-top: 2px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #238636;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .social-link {
            display: block;
            color: #58a6ff;
            text-decoration: none;
            margin-top: 15px;
            font-size: 14px;
        }
        .social-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Στυλιανός Μηλιαράκης</h1>
        <p>Head of Portfolio Management & Trading<br>@ Forena Energy</p>
        
        <div class="education">
            <h3>🎓 Εκπαιδευση</h3>
            <ul>
                <li>
                    <strong>MBA</strong>
                    <span class="univ">NTUA & AUEB</span>
                </li>
                <li>
                    <strong>MSc Energy Systems Design</strong>
                    <span class="univ">Heriot-Watt University</span>
                </li>
                <li>
                    <strong>MEng Electrical and Computer Engineering</strong>
                    <span class="univ">NTUA</span>
                </li>
            </ul>
        </div>

        <a href="contact.vcf" class="btn" download="Stylianos_Miliarakis.vcf">
            📥 Αποθήκευση Επαφής
        </a>
        
        <a href="https://www.linkedin.com/in/steliosm" target="_blank" class="social-link">🔗 LinkedIn</a>
        <a href="https://scholar.google.com/citations?user=LXHbzJsAAAAJ&hl=el" target="_blank" class="social-link">📚 Google Scholar</a>
        <a href="mailto:steliosm77@gmail.com" class="social-link">✉️ steliosm77@gmail.com</a>
    </div>

</body>
</html>
