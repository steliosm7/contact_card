<style>
:root {
    color-scheme: dark;
    --bg: #010305; 
    --surface: #02070A; 
    --line: #16242e; 
    --text: #ffffff; 
    --muted: #7a8b99;
    --accent: #0297DE;
    --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { 
    margin: 0; 
    min-height: 100%; 
    overflow-x: hidden; 
  }
  body {
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: max(20px, env(safe-area-inset-top)) 0 max(20px, env(safe-area-inset-bottom)) 0;
    -webkit-font-smoothing: antialiased;
  }
  
  /* glow: αλλάζει το rgba αν αλλάξεις το --accent */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 45% at 50% 0%, rgba(2,151,222,.20), transparent 70%),
      radial-gradient(50% 35% at 50% 100%, rgba(2,151,222,.08), transparent 70%);
  }
  .card {
    width: calc(100% - 40px);
    max-width: 340px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px 20px 16px; 
    animation: rise .6s cubic-bezier(.2,.7,.2,1) both;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  }

  .avatar {
    width: 80px; height: 80px; 
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 26px; letter-spacing: .02em;
    color: var(--accent);
    background: var(--bg);
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 6px var(--surface), 0 0 0 7px var(--line), 0 0 32px rgba(2,151,222,.28);
    overflow: hidden;
    margin: 4px auto 24px auto;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
