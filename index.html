<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>Στυλιανός Μηλιαράκης</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1014;
    --surface: #161920;
    --line: #262a33;
    --text: #eef0f4;
    --muted: #8a90a0;
    --accent: #8aa4ff;
    --accent-ink: #0b1030;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 32px 28px 12px;
    animation: rise .6s cubic-bezier(.2,.7,.2,1) both;
  }
  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 30px; letter-spacing: .02em;
    color: var(--accent);
    background: var(--bg);
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 6px var(--surface), 0 0 0 7px var(--line);
    overflow: hidden;
    margin: 4px 0 28px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
  .role { margin: 8px 0 0; color: var(--accent); font-size: 15px; font-weight: 600; }
  .degrees { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  .uni { margin: 2px 0 0; color: var(--muted); font-size: 13px; opacity: .7; }

  .save {
    margin: 28px 0 8px;
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 20px;
    border: 0; border-radius: 16px;
    background: var(--accent); color: var(--accent-ink);
    font: 700 15px "Manrope", sans-serif;
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  .save:hover { filter: brightness(1.08); }
  .save:active { transform: scale(.98); }
  .save svg { width: 18px; height: 18px; }

  .links { list-style: none; margin: 8px 0 0; padding: 0; }
  .links li + li { border-top: 1px solid var(--line); }
  .links a {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 4px;
    color: var(--text); text-decoration: none;
    transition: color .15s ease;
  }
  .links a:hover { color: var(--accent); }
  .ico {
    flex: none; width: 40px; height: 40px;
    border-radius: 12px; background: var(--bg); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--accent);
  }
  .ico svg { width: 18px; height: 18px; }
  .meta { display: flex; flex-direction: column; min-width: 0; }
  .meta small { color: var(--muted); font-size: 12px; font-weight: 500; }
  .meta span { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } .save { transition: none; } }
</style>
</head>
<body>

<main class="card">
  <div class="avatar" id="avatar"></div>
  <h1 id="name"></h1>
  <p class="role" id="role"></p>
  <p class="degrees" id="degrees"></p>
  <p class="uni" id="uni"></p>

  <button class="save" id="save" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
    Αποθήκευση επαφής
  </button>

  <ul class="links" id="links"></ul>
</main>

<script>
  const C = {
    first: "Στυλιανός",
    last: "Μηλιαράκης",
    title: "Head of Portfolio Management & Trading",
    org: "Forena Energy",                                
    degrees: "Electrical and Computer Engineer, MSc, MBA",
    uni: "NTUA",                                
    photo: "",                                 // Προαιρετικό: βάλε το link της φωτογραφίας σου αν θέλεις
    phone: "+30 697 768 2963",                 // Συμπλήρωσε τα ψηφία που λείπουν
    email: "steliosm77@gmail.com",
    linkedin: "https://www.linkedin.com/in/steliosm",
    scholar: "https://scholar.google.com/citations?user=LXHbzJsAAAAJ&hl=el"
  };

  const icons = {
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    scholar: '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>'
  };

  const $ = id => document.getElementById(id);
  const fullName = `${C.first} ${C.last}`;
  document.title = fullName;

  if (C.photo) {
    const img = document.createElement("img");
    img.src = C.photo; img.alt = fullName;
    $("avatar").appendChild(img);
  } else {
    $("avatar").textContent = (C.first[0] + C.last[0]).toUpperCase();
  }

  $("name").textContent = fullName;
  $("role").textContent = C.org ? `${C.title} · ${C.org}` : C.title;
  $("degrees").textContent = C.degrees || "";
  $("uni").textContent = C.uni || "";
  if (!C.degrees) $("degrees").remove();
  if (!C.uni) $("uni").remove();

 const rows = [
    C.phone    && { k: "phone",    label: "Κινητό",         text: C.phone, href: "tel:" + C.phone.replace(/\s/g, "") },
    C.email    && { k: "mail",     label: "Email",          text: C.email, href: "mailto:" + C.email },
    C.linkedin && { k: "linkedin", label: "LinkedIn",       text: C.linkedin.replace(/^https?:\/\/(www\.)?/, ""), href: C.linkedin, ext: true },
    C.scholar  && { k: "scholar",  label: "Google Scholar", text: C.scholar.replace(/^https?:\/\/(www\.)?/, ""), href: C.scholar, ext: true }
  ].filter(Boolean);

  $("links").innerHTML = rows.map(r => `
    <li><a href="${r.href}" ${r.ext ? 'target="_blank" rel="noopener"' : ""}>
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[r.k]}</svg></span>
      <span class="meta"><small>${r.label}</small><span>${r.text}</span></span>
    </a></li>`).join("");

  $("save").addEventListener("click", () => {
    const L = [
      "BEGIN:VCARD", "VERSION:3.0",
      `N:${C.last};${C.first};;;`, `FN:${fullName}`,
      C.org && `ORG:${C.org}`, C.title && `TITLE:${C.title}`,
      C.phone && `TEL;TYPE=CELL:${C.phone}`,
      C.email && `EMAIL;TYPE=INTERNET:${C.email}`,
      C.linkedin && `URL:${C.linkedin}`, C.scholar && `URL:${C.scholar}`,
      (C.degrees || C.uni) && `NOTE:${C.degrees} - ${C.uni}`,
      "END:VCARD"
    ].filter(Boolean).join("\r\n");
    const url = URL.createObjectURL(new Blob([L], { type: "text/vcard;charset=utf-8" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: `${C.first}_${C.last}.vcf` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
</script>
</body>
</html>
